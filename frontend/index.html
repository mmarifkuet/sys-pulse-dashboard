<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysPulse Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <h1>SysPulse Dashboard</h1>
        
        <!-- Live Metric Cards -->
        <div class="card-grid">
            <div class="card">
                <h3>CPU Load</h3>
                <p id="cpu-val">-- %</p>
            </div>
            <div class="card">
                <h3>RAM Usage</h3>
                <p id="ram-val">-- MB</p>
            </div>
            <div class="card">
                <h3>System Temp</h3>
                <p id="temp-val">-- °C</p>
            </div>
        </div>

        <!-- Real-Time Chart Container -->
        <div class="chart-container">
            <canvas id="metricsChart"></canvas>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
